<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header>
    <h1 class="header_text">GamesHub</h1>
    <div class="header_box">
    <h2 class="page selected_game">RPS</h2>
    <h2 class="page">TIC TAC TOE</h2>
    <h2 class="page">QUIZ</h2>

    </div>
    </header>
    <main>
        <section>
            <div class="caixa_RPS">
                <h1 class="titulo">Pedra, Papel, Tesoura</h1>


                <div class="conteiner_jogo">

                    <div class="player_choice">
                        <h1 class="h1_player">Sua Escolha:</h1>
                        <button class="RPS_button" id="button_pedra">
                            <img class="RPS_image"  src="./src/assets/stone_PNG13601.png" alt="">
                        </button>
                        <button class="RPS_button" id="button_papel">
                            <img class="RPS_image"  src="./src/assets/pngtree-stylish-white-torn-paper-texture-png-image_9234159.png" alt="">
                        </button>
                        <button class="RPS_button" id="button_tesoura">
                            <img class="RPS_image" src="./src/assets/pngtree-vector-scissors-png-image_8562922.png" alt="">
                        </button>
                    </div>

                <div class="placar_box">
                    <div class="placar_text">
                        <span class="ponto_player" id="scorePlayer">0</span>X<span class="ponto_player" id="scoreBot">0</span>
                    </div>
                </div>

                    <div class="bot_choice">
                        <h1 class="h1_bot">Escolha Bot:</h1>
                        <button class="RPS_button_bot" id="button_pedraBot">
                            <img class="RPS_image"  src="./src/assets/stone_PNG13601.png" alt="">
                        </button>
                        <button class="RPS_button_bot" id="button_papelBot">
                            <img class="RPS_image"  src="./src/assets/pngtree-stylish-white-torn-paper-texture-png-image_9234159.png" alt="">
                        </button>
                        <button class="RPS_button_bot" id="button_tesouraBot">
                            <img class="RPS_image" src="./src/assets/pngtree-vector-scissors-png-image_8562922.png" alt="">
                        </button>
                    </div>

                </div>


                <button class="jogar_RPS" id="button_jogar">jogar</button>
                <h1 class="titulo" id="Resultado">Resultado</h1>
            </div>
        </section>
    </main>
    <script src="./src/script.js" defer></script>
</body>
</html>
