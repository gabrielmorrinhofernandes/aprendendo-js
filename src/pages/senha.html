<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .caixasenha{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            border: solid;
            border-color: black;
            max-width: 30rem;
            margin-top: 10rem;
        }
        form{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="caixasenha">
        <h2> insira seu nome de usuário e senha</h2>
        <form method="post">
            <label for="texto_user">Usuário</label><br>
            <input type="text"
            id="texto_user"
            name="texto_user"></input><br>
            <label for="texto-02">senha</label><br>
            <input type="password"
            id="texto_senha"
            name="texto_senha"></input><br>
            <label for="texto-03">tipo de usuário</label><br>
            <select name="seleção" id="select">
                <option value="US">Usuário</option>
                <option value="AD">Administrador</option>
            </select>
        </form>
        <button id="botao_entrar">
            enviar
        </button>
    </div>
    <script>
        const botao_entrar = document.getElementById("botao_entrar");
        botao_entrar.addEventListener("click", efetuar_login);

        function efetuar_login(){
            const user = document.getElementById("texto_user").value;
            const passWord = document.getElementById("texto_senha").value;
            const select = document.getElementById("select").value;
            if(user == 'gabriel' && passWord == '12345' && select == 'US'){
                alert('login efetuado com sucesso')
            }
            else if(user == 'gabriel' && passWord == '12345' && select == 'AD'){
                alert('tipo de usuário incorreto')
            }
            else if(user != 'gabriel' && passWord != '12345'){
                alert('usuario e senha incorreto')
            }
            else if(user != 'gabriel'){
                alert('usuario incorreto')
            }
            else{
                alert('senha incorreta')
            }







    }
    </script>
</body>
</html>
